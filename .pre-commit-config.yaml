# Local hooks only: every tool runs from the project .venv via scripts/hooks/venv-run.sh,
# so pre-commit downloads nothing. Install once:  .venv\Scripts\pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (autofix)
        entry: scripts/hooks/venv-run.sh ruff check --fix --force-exclude
        language: script
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: scripts/hooks/venv-run.sh ruff format --force-exclude
        language: script
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: scripts/hooks/venv-run.sh mypy
        language: script
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contracts)
        entry: scripts/hooks/venv-run.sh lint-imports
        language: script
        types: [python]
        pass_filenames: false
      - id: no-env-files
        name: block committing .env files
        entry: ".env files must never be committed (use .env.example)"
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '\.env\.example$'
