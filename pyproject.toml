[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tech-toppings-backend"
version = "0.1.0"
description = "Tech-Toppings API: a modular FastAPI backend hosting independent feature modules."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "argon2-cffi>=25.1",
  "beanie>=2.2",
  "email-validator>=2.3",
  "fastapi>=0.142",
  "httpx>=0.28",
  "limits>=5.8",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "pyjwt[crypto]>=2.15",
  "pymongo>=4.18",
  "pyyaml>=6.0.3",
  "structlog>=26.1",
  "tzdata>=2026.5",
  "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
  "actionlint-py>=1.7",
  "asgi-lifespan>=2.1",
  "import-linter>=2.15",
  "mypy>=2.4",
  "pip-audit>=2.10",
  "pip-tools>=7.6",
  "poethepoet>=0.48",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "respx>=0.23",
  "ruff>=0.16",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- tasks (poe)
# Only the tasks that need .env in their environment load it (HOST, PORT; TEST_MONGO_URI). The
# others read it through the settings, below the real environment, so `$env:APP_ENV =
# "production"` picks environments/production.env for seed, backup and restore (ADR-0019).

[tool.poe.tasks]
dev.cmd = "uvicorn app.main:create_app --factory --reload --host ${HOST} --port ${PORT} --no-access-log"
dev.envfile = { optional = [".env"] }
dev.env = { HOST.default = "127.0.0.1", PORT.default = "8000" }
dev.help = "Run the API with auto-reload"

lint.sequence = ["lint-ruff", "lint-format", "typecheck", "imports"]
lint.help = "All static checks (ruff, format, mypy, import-linter)"
lint-ruff = "ruff check ."
lint-format = "ruff format --check ."
typecheck.sequence = ["mypy", "python scripts/typecheck_skills.py"]
typecheck.default_item_type = "cmd"
imports = "lint-imports"
fmt.sequence = ["ruff format .", "ruff check --fix ."]
fmt.default_item_type = "cmd"
fmt.help = "Auto-format and auto-fix"

test.cmd = "pytest --cov --cov-report=term-missing"
test.envfile = { optional = [".env"] }
test.help = "Run the test suite with coverage (needs MongoDB, see README)"
audit.cmd = "pip-audit --requirement requirements/base.lock --no-deps --disable-pip --progress-spinner off"
audit.help = "Check pinned runtime dependencies for known vulnerabilities"
actionlint.cmd = "actionlint"
actionlint.help = "Lint every GitHub Actions workflow"
check.sequence = ["lint", "test", "audit", "actionlint"]
check.help = "Everything CI runs, locally"

lock.sequence = [
  "pip-compile pyproject.toml --output-file requirements/base.lock --strip-extras --no-emit-index-url --quiet",
  "pip-compile pyproject.toml --extra dev --output-file requirements/dev.lock --strip-extras --no-emit-index-url --quiet",
]
lock.default_item_type = "cmd"
lock.env = { CUSTOM_COMPILE_COMMAND = "poe lock" }
lock.help = "Re-pin dependencies from pyproject.toml"
sync.sequence = ["pip-sync requirements/dev.lock", "pip install --no-deps --editable ."]
sync.default_item_type = "cmd"
sync.help = "Make .venv match requirements/dev.lock exactly"

seed.cmd = "python scripts/seed.py"
seed.help = "Idempotent seed data (bootstrap admin from BOOTSTRAP_ADMIN_*)"
reset-password.cmd = "python scripts/reset_password.py"
reset-password.help = "Admin reset: poe reset-password --email someone@example.com"
new-module.cmd = "python scripts/new_module.py"
new-module.help = "Make a module in both repositories: poe new-module --spec docs/modules/<key>.yaml"
backup.cmd = "python scripts/backup_db.py"
backup.help = "Back up the whole database (MONGO_URI) to a new folder under BACKUP_DIR"
restore.cmd = "python scripts/restore_db.py"
restore.help = "Restore a backup: poe restore --from backups/<folder> [--drop] [--yes]"
smoke-live.cmd = "python scripts/smoke_live.py"
smoke-live.help = "Check the live app end to end: poe smoke-live --app https://... [--api https://...]"
vapid-keys.cmd = "python scripts/gen_vapid_keys.py"
vapid-keys.help = "Print a new VAPID key pair for Web Push (PUSH_VAPID_*), for .env"

openapi.cmd = "python scripts/export_openapi.py"
openapi.help = "Write openapi.json (consumed by the frontend type generator)"
eval-parser.cmd = "python scripts/eval_parser.py"
eval-parser.help = "Accuracy of the expenses rule parser by language and field (--misses lists errors)"
eval-receipts.cmd = "python scripts/eval_receipts.py"
eval-receipts.help = "Receipt scanning on the 20 samples: the rules on OCR text (--paper: as printed), or --ai on the photos"

docker-build.cmd = "docker build --tag tech-toppings-backend:local ."

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]  # keep hand-aligned snippets in Markdown untouched

[tool.ruff.lint]
select = [
  "A", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "ERA", "F", "FAST", "I", "N", "PERF", "PL",
  "PT", "PTH", "RET", "RUF", "S", "SIM", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
  "TRY003", # explicit messages on AppError subclasses are intended
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.isort]
# Named, not guessed from the folders on disk: a module `poe new-module` is about to write
# sorts the same as one already there.
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException".msg = "Raise an app.core.errors.AppError subclass instead."
"starlette.exceptions.HTTPException".msg = "Raise an app.core.errors.AppError subclass instead."
"os.getenv".msg = "Read configuration through app.core.config.Settings."
"os.environ".msg = "Read configuration through app.core.config.Settings."

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["TID251"]   # the one place allowed to read the environment
"app/core/errors.py" = ["TID251"]   # registers the handler for Starlette's HTTPException
"app/platform/__init__.py" = ["A005"]  # app.platform is a subpackage; no stdlib clash in practice
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"tests/helpers.py" = ["S101", "TID251"]  # reads TEST_MONGO_URI
"tests/conftest.py" = ["TID251"]  # strips settings variables for hermetic tests
"scripts/**" = ["T20"]
"app/**/router.py" = ["PLR0913", "PLR0917"]  # FastAPI endpoints receive many injected dependencies

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]
# Skill scripts share file names and sit in non-package folders: scripts/typecheck_skills.py
# checks them one by one.
exclude = ["/skills/[^/]+/scripts/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers: modules -> platform -> core (never upwards)"
type = "layers"
layers = ["(app.modules)", "app.platform", "app.core"]

[[tool.importlinter.contracts]]
name = "Modules are independent of each other"
type = "independence"
modules = ["app.modules.*"]

[[tool.importlinter.contracts]]
name = "Modules use the platform API (app.platform), not core or platform internals"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = [
    "app.core",
    "app.main",
    "app.platform.auth",
    "app.platform.health",
    "app.platform.modules",
    "app.platform.users",
]
allow_indirect_imports = true

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
