# Words for reading a day's attendance from what the owner says or types (mark-attendance's
# static mode). One list per meaning, English, Tamil, Hindi and the romanised forms mixed.
# English words match whole; Tamil and Hindi ones as stems at a word's start, except short
# words (3 letters or fewer), which match whole. Where two words overlap ("नहीं आया" and
# "आया"), the longer one counts.
#
# Message codes (worded on the app): mark-attendance.ready {count}, .unsure {count} (some
# names or marks to choose), .nothing (no marks read), .which_project (several open
# projects: say it on the project's attendance page), .no_project.

tool: labor_attendance_draft

statuses:
  full:
    - full day
    - full
    - poora din
    - pura din
    - muzhu naal
    - முழு நாள்
    - முழுநாள்
    - पूरा दिन
    - पूरे दिन
  half:
    - half day
    - half
    - halfday
    - aadha din
    - adha din
    - arai naal
    - அரை நாள்
    - அரைநாள்
    - அரை
    - आधा दिन
    - आधे दिन
    - आधा
    - हाफ डे
    - हाफ़ डे
  absent:
    - absent
    - leave
    - on leave
    - did not come
    - didn't come
    - not come
    - did not came
    - didn't came
    - not came
    - not present
    - no show
    - nahi aaya
    - nahi aya
    - nahin aaya
    - chhutti
    - varala
    - varavillai
    - வரவில்லை
    - வரலை
    - வரல
    - லீவு
    - விடுப்பு
    - गैरहाज़िर
    - गैरहाजिर
    - ग़ैरहाज़िर
    - अनुपस्थित
    - छुट्टी
    - नहीं आया
    - नहीं आई
    - नहीं आयी
    - नहीं आए
    - नही आया
    - नही आई
    - नही आयी
    - नही आए

# Words that say someone came: a full day, unless a mark is said straight after ("Ravi came,
# half day" is a half day).
present:
  - present
  - came
  - come
  - hazir
  - haazir
  - வந்தார்
  - வந்தாள்
  - வந்தான்
  - வந்தாங்க
  - வந்தது
  - हाज़िर
  - हाजिर
  - आया
  - आई
  - आयी
  - आए

# Everyone not named ("Ravi half day, the rest full day").
rest:
  - the rest
  - rest
  - everyone else
  - all others
  - others
  - remaining
  - baaki
  - baki
  - மற்றவர்கள்
  - மற்றவங்க
  - மற்ற எல்லோரும்
  - மீதி
  - மீதமுள்ளவர்கள்
  - बाकी
  - बाक़ी
  - बाकी सब
  - बाकी लोग
  - बचे हुए

# Everyone: the workers not named ("everyone full day, Meena half day").
everyone:
  - everyone
  - everybody
  - all
  - all workers
  - sab
  - sabhi
  - எல்லோரும்
  - எல்லாரும்
  - அனைவரும்
  - सब
  - सभी
  - सब लोग

# Which day, as days back from today ("कल" is read as yesterday: attendance is of the past).
days:
  0: [today, aaj, indru, இன்று, இன்னைக்கு, आज]
  1: [yesterday, kal, netru, நேற்று, நேத்து, कल]
  2: [day before yesterday, parson, முந்தாநேற்று, முந்தா நேத்து, परसों]

# A worker by number: "number 3", "W003", "எண் 3", "नंबर 3".
number: [number, num, "no", worker, w, எண், நம்பர், नंबर, नम्बर, क्रमांक]

# Words around the names and marks that are neither: what is left is taken as a name to check.
# A filler also keeps a word it holds from being taken for a mark ("हाजिरी", attendance, is no
# "हाजिर", present).
fillers:
  - and
  - also
  - then
  - "on"  # quoted: bare, YAML reads it as true
  - time
  - late
  - early
  - today
  - by
  - mark
  - marked
  - is
  - was
  - were
  - are
  - for
  - of
  - the
  - a
  - day
  - days
  - work
  - today's
  - attendance
  - மற்றும்
  - இன்றைய
  - வருகை
  - நாள்
  - और
  - भी
  - का
  - की
  - के
  - ने
  - है
  - था
  - थी
  - हाज़िरी
  - हाजिरी
  - दिन

# A name heard a little differently from how it was saved ("Laxmi" for "Lakshmi") still
# matches at this likeness (0 to 1), and is marked for the owner to check.
similar_at: 0.65

# The most words that match no one handed over to check: past them it is talk, not names.
most_unknown: 20
