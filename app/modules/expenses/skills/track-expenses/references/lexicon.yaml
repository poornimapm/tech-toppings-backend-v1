# Static mode vocabulary for the track-expenses skill.
#
# Without AI this skill can only open the expenses page: recording an entry from a sentence
# needs the parser that arrives with voice capture. The first action whose words appear in
# the request wins.
#
#   tool   a client tool: what is shown to the user
# Message codes (translated by the client, agentMessages.*):
#   track-expenses.ready.<action>   the reply

actions:
  open:
    words: ["open expenses", "show expenses", "my expenses", "expense list", "open expense",
            "செலவுகளைத் திற", "செலவுகளைக் காட்டு", "என் செலவுகள்",
            "खर्च खोलें", "खर्च दिखाएँ", "मेरे खर्च"]
    tool: expenses_open
