# Number words in English, Tamil and Hindi, and the way people type them in Latin letters.
#
#   values       a word that is a number by itself; said one after another they add up
#                ("two hundred fifty", "இருநூற்று ஐம்பது")
#   multipliers  multiply what was said just before them ("five thousand", "2 lakh", "पाँच सौ")
#   shifts       Hindi words that change the number after them ("साढ़े तीन" = 3.5)
#
# Speech recognition usually writes amounts as digits, so this covers the common words rather
# than every number. The accuracy report (scripts/eval_parser.py) shows what is missed.

