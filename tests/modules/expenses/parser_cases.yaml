# Labelled inputs for the rule parser (ADR-0013 static mode; plan section 8).
#
# Each case is what a person might say, type or paste, and what should be understood.
# "Today" is Thursday 2026-10-08 for every case.
#
#   lang    en | ta | hi | mixed | sms
#   text    the input
#   want    one item per entry expected, each with:
#             amount  in the currency's main unit
#             item    words the title must contain (not checked for sms)
#             kind    income, when money came in (default: expense)
#             ago     days before today, when a day was said
#
# This is the set the lexicons were grown against, so its scores say what the parser knows,
# not how it does on sentences it has never seen. Add real misses here before fixing them.

