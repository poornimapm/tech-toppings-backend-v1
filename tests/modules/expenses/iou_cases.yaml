# Labelled loan sentences for the static reading of loans (track-expenses, references/ious.yaml):
# money lent or borrowed, and payments on it. "Today" is Thursday 2026-10-08 for every case.
#
#   lang       en | ta | hi | mixed
#   text       the input
#   action     new: money lent or borrowed; repay: a payment on it
#   direction  lent: the user gave the money; borrowed: the user took it
#   person     the other person, as it should be read
#   amount     in the currency's main unit
#
# The sentences that only look like loans ("gave 200 to the watchman", a refund, "I'll be back")
# are labelled in parser_cases_unseen.yaml and iou_near_misses.yaml; none may read as a loan.

