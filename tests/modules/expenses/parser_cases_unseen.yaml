# Held-out inputs: written without looking at what the parser knows, and scored as they are.
# The main file (parser_cases.yaml) is the set the lexicons were grown against, so it flatters
# the parser; this one is the honest estimate for sentences it has not seen.
#
# Do not tune the lexicons to these. When a miss here is fixed, move that case to the main
# file and add a fresh one here. Same format, same "today" (Thursday 2026-10-08).

